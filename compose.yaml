services:
  cinema-watch:
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    restart: unless-stopped
    environment:
      PORT: "8000"
      WATCH_INTERVAL_SECONDS: "${WATCH_INTERVAL_SECONDS:-900}"
    expose:
      - "8000"
    volumes:
      - cinema-watch-data:/app/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s

volumes:
  cinema-watch-data:
