services:
  cinema-watch:
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    restart: unless-stopped
    environment:
      PORT: "8000"
      WATCH_FIXED_INTERVAL_SECONDS: "${WATCH_FIXED_INTERVAL_SECONDS:-}"
      DISCORD_WEBHOOK_URL: "${DISCORD_WEBHOOK_URL:-}"
      DISCORD_APPLICATION_ID: "${DISCORD_APPLICATION_ID:-}"
      DISCORD_PUBLIC_KEY: "${DISCORD_PUBLIC_KEY:-}"
      DISCORD_ALLOWED_GUILD_ID: "${DISCORD_ALLOWED_GUILD_ID:-}"
      DISCORD_ALLOWED_USER_IDS: "${DISCORD_ALLOWED_USER_IDS:-}"
      DISCORD_BOT_TOKEN: "${DISCORD_BOT_TOKEN:-}"
    expose:
      - "8000"
    volumes:
      - cinema-watch-data:/app/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s

volumes:
  cinema-watch-data:
